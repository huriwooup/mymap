<style>
:root{--cream:#fffaf3;--pink:#f5b7cb;--soft:#ffebf1;--ink:#343238;--muted:#817a7e;--line:#eee4e1;--orange:#f39b49}
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:white}button,input,select{font:inherit}button{cursor:pointer}
.layout{display:flex;height:100dvh;min-height:420px}.sidebar{width:385px;max-width:46%;min-width:310px;padding:26px 22px;overflow-y:auto;background:var(--cream);border-right:1px solid var(--line)}
.eyebrow{font-size:11px;letter-spacing:2px;color:#bc718e;font-weight:800}h1{font-size:26px;letter-spacing:-1px;margin:10px 0 7px}.intro{font-size:13px;line-height:1.65;color:var(--muted);margin:0 0 18px}
.mode-tabs,.category-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 8px;color:var(--ink)}.tab.active{background:var(--pink);border-color:var(--pink);font-weight:800}
.search{width:100%;border:1px solid #e6dfe0;background:white;padding:13px 14px;border-radius:13px;outline:0}.search:focus,select:focus{border-color:#e69bb6;outline:2px solid #ffe3ed}
label{display:block;font-size:12px;font-weight:700;margin:13px 0 7px}select{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:11px}
.controls{display:flex;gap:7px;margin:12px 0}.action{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;flex:1}.action.primary{background:var(--soft);border-color:#f7cede;font-weight:700}
.section-heading{display:flex;align-items:center;justify-content:space-between;margin:22px 0 11px}.section-heading h2{font-size:16px;margin:0}.count{font-size:12px;background:var(--soft);color:#a45d79;border-radius:20px;padding:5px 10px}
#status{font-size:12px;color:var(--muted);line-height:1.6;min-height:18px;margin-bottom:12px}#results{display:grid;gap:9px}.place{display:block;width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:14px;padding:13px;transition:background .15s}.place:hover,.place.selected{background:var(--soft);border-color:#efabc3}.name{display:block;font-size:14px;font-weight:700;margin-bottom:5px}.detail{display:block;font-size:12px;color:var(--muted);line-height:1.5}.pick{color:#bc6689;font-size:11px;font-weight:700}.empty{padding:19px 5px;color:var(--muted);font-size:13px;text-align:center}
.map-area{position:relative;flex:1;min-width:0}#map{width:100%;height:100%;background:#ebeee9}.legend{position:absolute;right:14px;top:14px;z-index:2;background:#ffffffed;padding:10px 12px;border-radius:12px;box-shadow:0 3px 12px #0001;font-size:12px}.legend div+div{margin-top:6px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.info{width:245px;padding:13px 15px;line-height:1.55;overflow-wrap:anywhere}.info strong{display:block;font-size:15px;padding-right:12px}.info p{font-size:12px;color:#666;margin:5px 0}.info a{color:#ad5c80;font-weight:700;font-size:12px}.hidden{display:none!important}
@media(max-width:680px){.layout{flex-direction:column}.sidebar{width:100%;max-width:none;min-width:0;height:48%;padding:17px}.map-area{height:52%;flex:none}h1{font-size:23px}.legend{font-size:11px}}
</style>

<body>
<main class="layout">
<aside class="sidebar">
 <div class="eyebrow">MY FOOD MAP</div><h1>몰라 뭘 많이 먹었어 🍰</h1>
 <p class="intro">내가 고른 맛집부터 지금 있는 곳 주변의 새로운 카페까지.</p>
 <div class="mode-tabs" aria-label="탐색 방식">
  <button id="recommendMode" class="tab active" type="button" aria-pressed="true">💗 나의 추천</button>
  <button id="nearbyMode" class="tab" type="button" aria-pressed="false">📍 주변 탐색</button>
 </div>
 <input id="searchInput" class="search" type="search" placeholder="추천 장소 이름 검색" aria-label="장소 검색">
 <div class="category-tabs" aria-label="카테고리">
  <button id="foodTab" class="tab active" type="button" aria-pressed="true">🍽️ 맛집</button>
  <button id="cafeTab" class="tab" type="button" aria-pressed="false">🍓 카페·디저트</button>
 </div>
 <div id="recommendControls"><label for="regionSelect">지역 선택</label><select id="regionSelect"><option value="all">전체 지역</option><option value="서울">서울</option><option value="경기">경기</option><option value="부산">부산</option><option value="강원">강원</option></select></div>
 <div id="nearbyControls" class="hidden"><p class="detail">지도 중심 반경 2km에서 검색합니다. 지도를 옮긴 뒤 재검색할 수 있어요.</p>
  <div class="controls"><button id="refreshButton" class="action primary" type="button">↻ 이 지도에서 재검색</button><button id="myLocationButton" class="action" type="button">◎ 내 위치로 이동</button></div></div>
 <div class="section-heading"><h2 id="listHeading">나의 추천 장소</h2><span id="count" class="count">0곳</span></div>
 <p id="status" role="status">지도를 준비하고 있어요.</p><div id="results"></div>
</aside>
<section class="map-area" aria-label="카카오 지도"><div id="map"></div><div class="legend"><div><i class="dot" style="background:#f39b49"></i>음식점</div><div><i class="dot" style="background:#ee88ab"></i>카페·디저트</div><div><i class="dot" style="background:#388be9"></i>현재 위치</div></div></section>
</main>
<script>
// 사전에 고른 26개 장소: 검증에 성공한 곳만 추천 지도에 표시합니다.
    const placeData = [
      [1,"일쏠레","서울 연남동","서울 마포구 연남로1길 22","연남 일쏠레","food","서울"],
      [2,"핵밥 성수점","서울 성수동","서울 성동구 연무장7길 7","핵밥 성수점","food","서울"],
      [3,"어텀브릿","서울 용산","서울 용산구 백범로99길 40","용산 어텀브릿","food","서울"],
      [4,"레이브피자","서울 용산","서울 용산구 청파로43길 7","용산 레이브피자","food","서울"],
      [5,"33호할머니칼국수","경기 안산","경기 안산시 단원구 대부황금로 1297","안산 33호할머니칼국수","food","경기"],
      [6,"나온","강원 강릉","강원특별자치도 강릉시 사천면 덕실길 235","강릉 나온 두부","food","강원"],
      [7,"카와카츠","서울 마포","서울 마포구 동교로 126","마포 카와카츠","food","서울"],
      [8,"연교","서울 연남동","서울 마포구 연희로1길 65","연남 연교","food","서울"],
      [9,"수라간","서울 연남동","서울 마포구 동교로38안길 3","연남 수라간","food","서울"],
      [10,"죠죠 성수","서울 성수동","서울 성동구 연무장17길 7","죠죠 성수","food","서울"],
      [11,"하이디라오 영등포점","서울 영등포","서울 영등포구 경인로 870","하이디라오 영등포점","food","서울"],
      [12,"산동","서울 용산","서울 용산구 한강대로39길 5","용산 산동","food","서울"],
      [13,"갓잇 성수점","서울 성수동","서울 성동구 연무장7가길 10","갓잇 성수점","food","서울"],
      [14,"쿠시노주방","서울 연남동","서울 마포구 동교로 218-1","연남 쿠시노주방","food","서울"],
      [15,"소문난 주문진막국수","부산 사직동","부산 동래구 사직로58번길 8","부산 사직 주문진막국수","food","부산"],
      [16,"라오삐약","서울 망원동","서울 마포구 희우정로10안길 5","망원 라오삐약","food","서울"],
      [17,"이재모피자 본점","부산 중구","부산 중구 광복중앙로 31","이재모피자 본점","food","부산"],
      [18,"해옫","서울 합정동","서울 마포구 독막로8길 30","합정 해옫","food","서울"],
      [19,"버뮤다 삼각지","서울 용산","서울 용산구 한강대로52길 19","버뮤다 삼각지","food","서울"],
      [20,"야키토리 경청","서울 삼각지","서울 용산구 한강대로54길 7","삼각지 야키토리 경청","food","서울"],
      [21,"더빌리지샵","부산 전포동","부산 부산진구 동성로25번길 15","부산 전포 더빌리지샵","cafe","부산"],
      [22,"커피벌스데이","서울 홍대","서울 마포구 와우산로29길 26-33","홍대 커피벌스데이","cafe","서울"],
      [23,"키에리","서울 이태원","서울 용산구 이태원로26길 16-8","이태원 키에리","cafe","서울"],
      [24,"멜티도나","서울 잠실","서울 송파구 백제고분로9길 41-1","잠실 멜티도나","cafe","서울"],
      [25,"브론시스","서울 연남동","서울 마포구 연희로1길 57","연남 브론시스","cafe","서울"],
      [26,"누크녹","서울 연남동","서울 마포구 성미산로 190-31","연남 누크녹","cafe","서울"]
    ].map(([id,name,area,address,keyword,category,region]) => ({id,name,area,address,keyword,category,region}));


// 화면 및 지도에 필요한 변수를 저장합니다.
const $ = id => document.getElementById(id);
let map, searchService, popup, locationOverlay, myPosition = null;
let mode = "recommend", category = "food", version = 0, activeMarkers = [];
const lookupCache = new Map();
const statusElement = $("status"), resultsElement = $("results");

// 주소와 상호명을 정리한 뒤 같은 곳인지 확인합니다.
function normalizeAddress(value){return String(value||"").replace(/^서울특별시|^서울시|^서울/,"서울").replace(/^부산광역시|^부산시|^부산/,"부산").replace(/^경기도|^경기/,"경기").replace(/^강원특별자치도|^강원도|^강원/,"강원").replace(/\([^)]*\)/g,"").replace(/[\s,]/g,"");}
function normalizeName(value){return String(value||"").toLowerCase().replace(/[\s()[\]·.,'’\-]/g,"");}
function namesMatch(a,b){const x=normalizeName(a),y=normalizeName(b);return x===y||(x.length>=3&&(y.startsWith(x)||(y.length>=3&&x.startsWith(y))));}
function addressMatches(expected,actual){const x=normalizeAddress(expected),y=normalizeAddress(actual);return !!y&&(y===x||(y.startsWith(x)&&!/^[-\d]/.test(y.slice(x.length))));}
function matchCandidate(place,item){return namesMatch(place.name,item.place_name)&&addressMatches(place.address,item.road_address_name)&&Number.isFinite(Number(item.x))&&Number.isFinite(Number(item.y))&&item.x!==""&&item.y!=="";}

// 키워드 검색의 최대 3페이지를 확인하고 여러 장소가 일치하면 임의로 선택하지 않습니다.
function lookupQuery(query, place){
 return new Promise(resolve=>{
  let results=[],finished=false;
  const done=value=>{if(!finished){finished=true;resolve(value);}};
  try{
   searchService.keywordSearch(query,(data,status,pagination)=>{
    if(finished)return;
    if(status===kakao.maps.services.Status.ZERO_RESULT){done({match:null,error:false});return;}
    if(status!==kakao.maps.services.Status.OK){done({match:null,error:true});return;}
    results.push(...data);
    if(pagination&&pagination.hasNextPage&&pagination.current<3){try{pagination.nextPage();}catch(e){done({match:null,error:true});}return;}
    const unique=new Map(results.filter(item=>matchCandidate(place,item)).map(item=>[item.id||item.x+","+item.y,item]));
    done({match:unique.size===1?[...unique.values()][0]:null,error:false});
   },{size:15,page:1});
  }catch(error){console.warn("추천 검색 오류",place.name,error);done({match:null,error:true});}
 });
}
async function locatePlace(place){
 if(lookupCache.has(place.id))return lookupCache.get(place.id);
 const task=(async()=>{
  let error=false;
  for(const query of [place.keyword,place.name+" "+place.address]){
   const result=await lookupQuery(query,place);
   if(result.match)return result.match;
   error=error||result.error;
  }
  if(error)lookupCache.delete(place.id); // 일시적인 API 실패는 다음에 다시 요청합니다.
  return null;
 })();
 lookupCache.set(place.id,task);
 return task;
}

function markerImage(type){
 const color=type==="food"?"#f39b49":"#ee88ab";
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="38" height="48" viewBox="0 0 38 48"><path d="M19 2C9 2 2 10 2 20c0 13 17 26 17 26s17-13 17-26C36 10 29 2 19 2Z" fill="${color}" stroke="white" stroke-width="3"/><circle cx="19" cy="19" r="7" fill="white"/></svg>`;
 return new kakao.maps.MarkerImage("data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg),new kakao.maps.Size(38,48),{offset:new kakao.maps.Point(19,46)});
}
function clearResults(){
 activeMarkers.forEach(marker=>marker.setMap(null));activeMarkers=[];
 if(popup)popup.close();resultsElement.replaceChildren();$("count").textContent="0곳";
}
function addPlace(item, type, isPick){
 const latitude=Number(item.y),longitude=Number(item.x);
 if(!Number.isFinite(latitude)||!Number.isFinite(longitude))return null;
 const position=new kakao.maps.LatLng(latitude,longitude);
 const marker=new kakao.maps.Marker({map,position,image:markerImage(type)});
 activeMarkers.push(marker);
 const button=document.createElement("button");button.type="button";button.className="place";
 const name=document.createElement("span");name.className="name";name.textContent=item.place_name;
 const address=document.createElement("span");address.className="detail";address.textContent=item.road_address_name||item.address_name||"주소 정보 없음";
 button.append(name,address);
 if(isPick){const tag=document.createElement("span");tag.className="pick";tag.textContent="♥ 나의 추천";button.append(tag);}
 resultsElement.append(button);
 function openInfo(){
  document.querySelectorAll(".place").forEach(node=>node.classList.remove("selected"));button.classList.add("selected");
  const wrapper=document.createElement("div");wrapper.className="info";
  const title=document.createElement("strong");title.textContent=item.place_name;
  const addressLine=document.createElement("p");addressLine.textContent="📍 "+(item.road_address_name||item.address_name||"주소 미등록");
  const typeLine=document.createElement("p");typeLine.textContent="🏷️ "+(item.category_name|| (type==="food"?"음식점":"카페·디저트"));
  wrapper.append(title,addressLine,typeLine);
  if(item.phone){const phone=document.createElement("p");phone.textContent="☎ "+item.phone;wrapper.append(phone);}
  if(isPick){const tag=document.createElement("p");tag.textContent="💗 직접 선정한 추천 장소";wrapper.append(tag);}
  const link=document.createElement("a");link.href=item.place_url||"https://map.kakao.com/";link.target="_blank";link.rel="noopener noreferrer";link.textContent="카카오맵에서 메뉴·영업시간 보기 ↗";wrapper.append(link);
  popup.setContent(wrapper);popup.open(map,marker);
 }
 button.addEventListener("click",()=>{map.setLevel(4);map.panTo(position);openInfo();});
 kakao.maps.event.addListener(marker,"click",openInfo);
 return position;
}

// 추천 화면: 이름·지역 필터를 적용하고 검증된 장소만 보여줍니다.
async function renderRecommendations(){
 const token=++version;clearResults();
 const keyword=normalizeName($("searchInput").value),region=$("regionSelect").value;
 const selected=placeData.filter(place=>place.category===category&&(region==="all"||place.region===region)&&normalizeName(place.name).includes(keyword));
 if(!selected.length){statusElement.textContent="조건에 맞는 추천 장소가 없습니다.";return;}
 statusElement.textContent=`추천 장소 ${selected.length}곳을 확인하고 있어요…`;
 const located=await Promise.all(selected.map(async place=>{
  try{return {place,result:await locatePlace(place)};}catch(error){console.warn("추천 처리 오류",error);return {place,result:null};}
 }));
 if(token!==version||mode!=="recommend")return;
 const bounds=new kakao.maps.LatLngBounds();let count=0;
 located.forEach(({place,result})=>{
  if(!result)return;
  const pos=addPlace(result,place.category,true);
  if(pos){bounds.extend(pos);count++;}
 });
 $("count").textContent=count+"곳";
 statusElement.textContent=`확인된 추천 장소 ${count}곳`;
 if(!count)resultsElement.innerHTML='<p class="empty">표시할 수 있는 추천 장소가 없습니다.</p>';
 else if(count===1){map.setCenter(bounds.getSouthWest());map.setLevel(4);}
 else map.setBounds(bounds,55,45,55,45);
}

// 주변 탐색: 검색어가 없으면 카테고리 검색, 있으면 주변 키워드 검색을 실행합니다.
function nearbyRequest(code,center,keyword){
 return new Promise(resolve=>{
  try{
   const callback=(data,status,pagination)=>resolve({data:status===kakao.maps.services.Status.OK?data:[],error:status!==kakao.maps.services.Status.OK&&status!==kakao.maps.services.Status.ZERO_RESULT,hasMore:!!(pagination&&pagination.hasNextPage)});
   const options={location:center,radius:2000,size:15,sort:kakao.maps.services.SortBy.DISTANCE};
   if(keyword)searchService.keywordSearch(keyword,callback,{...options,category_group_code:code});
   else searchService.categorySearch(code,callback,options);
  }catch(error){console.warn("주변 검색 오류",error);resolve({data:[],error:true,hasMore:false});}
 });
}
async function renderNearby(){
 if(!map)return;
 const token=++version;clearResults();
 const center=map.getCenter(),keyword=$("searchInput").value.trim(),code=category==="food"?"FD6":"CE7";
 statusElement.textContent="지도 중심 주변을 검색하고 있어요…";
 const outcome=await nearbyRequest(code,center,keyword);
 if(token!==version||mode!=="nearby")return;
 const unique=new Map(outcome.data.map(item=>[item.id||item.x+","+item.y,item]));
 const selected=[...unique.values()];
 selected.forEach(item=>{
  // 검색 결과가 추천 26곳과 일치하면 나의 추천 표시를 더합니다.
  const isPick=placeData.some(place=>place.category===category&&matchCandidate(place,item));
  addPlace(item,category,isPick);
 });
 $("count").textContent=selected.length+"곳";
 statusElement.textContent=outcome.error?"검색에 실패했어요. 재검색 버튼을 눌러 주세요.":`지도 중심 반경 2km · ${selected.length}곳${outcome.hasMore?" (첫 페이지 결과)":""}`;
 if(!selected.length)resultsElement.innerHTML='<p class="empty">해당 조건에 맞는 장소가 없습니다.</p>';
 // 주변 탐색에서는 지도 중심과 확대 수준을 바꾸지 않습니다.
}
function refresh(){if(!map)return; if(mode==="recommend")renderRecommendations();else renderNearby();}
function setMode(next){
 if(mode===next)return;
 mode=next;
 $("recommendMode").classList.toggle("active",mode==="recommend");$("nearbyMode").classList.toggle("active",mode==="nearby");
 $("recommendMode").setAttribute("aria-pressed",String(mode==="recommend"));$("nearbyMode").setAttribute("aria-pressed",String(mode==="nearby"));
 $("recommendControls").classList.toggle("hidden",mode!=="recommend");$("nearbyControls").classList.toggle("hidden",mode!=="nearby");
 $("searchInput").value="";$("searchInput").placeholder=mode==="recommend"?"추천 장소 이름 검색":"주변 음식점·카페 이름 검색";
 $("listHeading").textContent=mode==="recommend"?"나의 추천 장소":"주변 검색 결과";
 // 전국 추천 지도의 중심에서 검색하지 않도록 주변 탐색 시작점을 조정합니다.
 if(mode==="nearby" && map){map.setCenter(myPosition||new kakao.maps.LatLng(37.5665,126.9780));map.setLevel(5);}
 refresh();
}
function setCategory(next){category=next;$("foodTab").classList.toggle("active",next==="food");$("cafeTab").classList.toggle("active",next==="cafe");$("foodTab").setAttribute("aria-pressed",String(next==="food"));$("cafeTab").setAttribute("aria-pressed",String(next==="cafe"));refresh();}
$("recommendMode").addEventListener("click",()=>setMode("recommend"));$("nearbyMode").addEventListener("click",()=>setMode("nearby"));
$("foodTab").addEventListener("click",()=>setCategory("food"));$("cafeTab").addEventListener("click",()=>setCategory("cafe"));
$("regionSelect").addEventListener("change",refresh);
let inputDelay;
$("searchInput").addEventListener("input",()=>{clearTimeout(inputDelay);inputDelay=setTimeout(refresh,300);});
$("refreshButton").addEventListener("click",renderNearby);
$("myLocationButton").addEventListener("click",()=>{
 if(myPosition){map.setCenter(myPosition);map.setLevel(5);renderNearby();}
 else statusElement.textContent="현재 위치 권한을 허용해야 내 위치로 이동할 수 있어요. 브라우저 위치 설정을 확인해 주세요.";
});
function initializeMap(){
 try{
  map=new kakao.maps.Map($("map"),{center:new kakao.maps.LatLng(37.5665,126.9780),level:5});
  searchService=new kakao.maps.services.Places();popup=new kakao.maps.InfoWindow({removable:true,zIndex:8});
  renderRecommendations();
  // 위치 권한을 거절해도 추천 및 주변 탐색은 정상 작동합니다.
  if(navigator.geolocation)navigator.geolocation.getCurrentPosition(position=>{
   myPosition=new kakao.maps.LatLng(position.coords.latitude,position.coords.longitude);
   const dot=document.createElement("div");dot.style.cssText="width:18px;height:18px;border:3px solid white;border-radius:50%;background:#388be9;box-shadow:0 0 0 5px #388be933,0 1px 8px #0003";dot.title="내 위치";
   locationOverlay=new kakao.maps.CustomOverlay({position:myPosition,content:dot,xAnchor:.5,yAnchor:.5,zIndex:7});locationOverlay.setMap(map);
  },()=>console.info("위치 권한이 없어도 지도를 사용할 수 있습니다."),{timeout:10000,maximumAge:60000});
 }catch(error){console.error("지도 초기화 오류",error);statusElement.textContent="지도를 초기화하지 못했어요. JavaScript 키와 도메인을 확인해 주세요.";}
}
if(window.kakao&&kakao.maps&&kakao.maps.load){try{kakao.maps.load(initializeMap);}catch(error){console.error(error);statusElement.textContent="카카오 지도 로딩에 실패했습니다.";}}
else statusElement.textContent="카카오 SDK를 불러올 수 없어요. JavaScript 키와 GitHub Pages 도메인을 확인해 주세요.";
</script>
</body>
</html>
